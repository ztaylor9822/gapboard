<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Weekly NFL, college football and NBA projections against the DraftKings line, with posted plays and a public record.">

<meta property="og:description" content="Weekly NFL, college football and NBA projections against the DraftKings line, with posted plays and a public record.">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231b2530'/%3E%3Cpath d='M19 6 13 26' stroke='%23c2410c' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Gap Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a betting sheet. Sticky header (sport + search), a plays summary, then one row per
   game with the three markets in aligned columns — spread, total, moneyline — so the eye can
   run down any one market. Rows expand for the reasoning. */
:root{
  --bg:#f5f6f8; --card:#ffffff; --sunk:#eef0f3; --ink:#1b2530; --muted:#667585; --faint:#98a3af; --rule:#e2e6eb;
  --accent:#c2410c; --play:#15803d; --play-bg:#e7f5ec; --pass-bg:#f1f3f5; --sharp-bg:#fdeee6;
  --bar-a:#1b2530; --bar-b:#c9d2dc;
  --display:"Big Shoulders Display","Oswald","Arial Narrow",Impact,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161c; --card:#181f27; --sunk:#141a21; --ink:#e4e9ee; --muted:#9aa7b4; --faint:#6b7885; --rule:#26303b;
  --accent:#fb8a4c; --play:#4ade80; --play-bg:#163222; --pass-bg:#1d252e; --sharp-bg:#3a2417;
  --bar-a:#e4e9ee; --bar-b:#3a4654; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161c; --card:#181f27; --sunk:#141a21; --ink:#e4e9ee; --muted:#9aa7b4; --faint:#6b7885; --rule:#26303b;
  --accent:#fb8a4c; --play:#4ade80; --play-bg:#163222; --pass-bg:#1d252e; --sharp-bg:#3a2417;
  --bar-a:#e4e9ee; --bar-b:#3a4654; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--body);padding-inline:16px;padding-block:0 56px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1040px;margin:0 auto}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-inline:-16px;padding:12px 16px;border-bottom:1px solid var(--rule)}
.top .in{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font:900 24px/1 var(--display);letter-spacing:.02em;text-transform:uppercase;margin-right:auto}
.brand span{color:var(--accent)}
.tabs{display:flex;gap:2px;background:var(--sunk);padding:3px;border-radius:8px}
.tabs button{border:0;background:none;padding:6px 12px;border-radius:6px;font-weight:500;font-size:14px;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.search{position:relative;flex:0 1 220px;min-width:0}
.search input{width:100%;border:1px solid var(--rule);background:var(--card);border-radius:8px;padding:7px 10px;font-size:14px}
@media (max-width:640px){.brand{font-size:21px}.search{flex-basis:100%}}

/* page head */
.head{padding-block:24px 4px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.eyebrow{font:600 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font:800 clamp(30px,6vw,42px)/1 var(--display);text-transform:uppercase;letter-spacing:.01em;margin:4px 0 0}
.stamp{font-size:13px;color:var(--muted);text-align:right}
p.lede{color:var(--muted);max-width:70ch;margin:10px 0 0;font-size:14px}
h2{font:600 18px var(--body);margin:36px 0 10px}
h3{font:600 15px var(--body);margin:22px 0 8px}

/* plays summary */
.plays{background:var(--card);border:1px solid var(--rule);border-radius:10px;margin-top:18px;overflow:hidden}
.plays .ph{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:12px 16px;border-bottom:1px solid var(--rule)}
.plays .ph b{font-size:15px}
.plays .ph span{font-size:13px;color:var(--muted);text-align:right}
.prow{display:grid;grid-template-columns:6rem minmax(0,1fr) minmax(0,15rem) minmax(0,9.5rem);grid-template-areas:"mk pick why size";gap:4px 14px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--rule);cursor:pointer;font-size:14px}
.prow:last-child{border-bottom:0}
.prow:hover{background:var(--sunk)}
.prow .mk{grid-area:mk;font-size:12px;color:var(--muted)}
.prow .pick{grid-area:pick;min-width:0}
.prow .pick small{display:block;font-size:12px;color:var(--muted)}
.prow .why{grid-area:why;font-size:13px;color:var(--muted);text-align:right}
.prow .size{grid-area:size;font-family:var(--mono);text-align:right;white-space:nowrap}
@media (max-width:640px){.prow{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"mk size" "pick pick" "why why"}.prow .why{text-align:left}}
.plays .empty{padding:14px 16px;color:var(--muted);font-size:14px}
.note{font-size:13px;color:var(--muted);max-width:72ch}
.callout{font-size:13px;color:var(--muted);background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:10px 14px;margin-top:12px;max-width:80ch}

/* filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 4px}
.chip{border:1px solid var(--rule);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .c{font-family:var(--mono);margin-left:4px;opacity:.75}

/* board: one card per game. Up front: time, teams, projected score, Vegas line vs model line, the pick
   with the line gap. Everything else sits behind "Game breakdown". */
.day{font:600 13px var(--body);color:var(--muted);margin:22px 0 8px;display:flex;justify-content:space-between}
.games{display:grid;gap:10px}
.game{background:var(--card);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.game.has-play{border-color:var(--play);box-shadow:inset 4px 0 0 var(--play)}
.gc{padding:14px 18px 16px}
.gmeta{display:flex;justify-content:space-between;align-items:center;gap:10px;font:400 12px var(--mono);color:var(--muted);letter-spacing:.02em}
.gmeta .vn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.teams{margin-top:10px;display:grid;gap:6px}
.tm{display:flex;justify-content:space-between;gap:12px;align-items:center}
.tm .n{font-weight:600;font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.25}
.tm .rec{display:block;font:400 12px var(--mono);color:var(--faint)}
.tm .s{font:600 20px var(--mono);font-variant-numeric:tabular-nums}
.tm.dog .n,.tm.dog .s{color:var(--muted)}
.lines{display:grid;grid-template-columns:repeat(2,minmax(0,max-content));gap:6px 40px;border-top:1px solid var(--rule);margin-top:14px;padding-top:12px}
.lines .k,.pickrow .k{font:400 11px var(--mono);color:var(--muted);letter-spacing:.02em}
.lines .v{font:500 15px var(--mono);margin-top:2px;white-space:nowrap}
.lines .v.model{color:var(--ink)}
.pickrow{display:flex;align-items:center;flex-wrap:wrap;gap:6px 12px;border-top:1px solid var(--rule);margin-top:12px;padding-top:12px}
.pickrow .pk{font:600 16px var(--body);color:var(--accent)}
.pickrow .pk .gap{font-family:var(--mono);font-weight:500}
.pickrow .pk.none{color:var(--muted);font-weight:500;font-size:14px}
.also{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{display:inline-block;font:600 12px var(--body);padding:2px 8px;border-radius:5px;white-space:nowrap}
.tag.play{background:var(--play);color:var(--card);font-weight:700;letter-spacing:.02em}
.tag.lean{background:var(--pass-bg);color:var(--ink);font-weight:500}
.tag.lean .p{color:var(--muted);font-weight:400}
.tag.pass{background:var(--pass-bg);color:var(--muted);font-weight:500}
.tag.sharp{background:var(--sharp-bg);color:var(--accent)}
.bd{margin-top:14px;border:1px solid var(--rule);background:var(--sunk);border-radius:7px;padding:8px 14px;font:500 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;color:var(--ink)}
.bd:hover{border-color:var(--muted)}
.game.open .bd{background:var(--ink);color:var(--card);border-color:var(--ink)}
.mkts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:14px 18px;border-top:1px solid var(--rule);background:var(--sunk)}
.mkt{min-width:0;font-size:13px;line-height:1.35;background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:10px 12px}
.mkt.is-play{background:var(--play-bg);border-color:var(--play)}
.mkt .big{font:500 15px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mkt .sub{color:var(--muted);overflow-wrap:anywhere}
.mkt .tag{margin-top:6px;white-space:normal}
.mlabel{display:block;font:600 10px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:3px}
@media (max-width:640px){
  .gc{padding:12px 14px 14px}
  .lines{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 16px}
  .lines .v{white-space:normal;font-size:14px}
  .mkts{grid-template-columns:1fr;padding:12px 14px}
}

/* detail */
.detail{border-top:1px solid var(--rule);padding:14px 18px 18px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;background:var(--sunk)}
@media (max-width:860px){.detail{grid-template-columns:1fr}}
.detail h4{font:600 12px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:3px 0;border-bottom:1px dashed var(--rule)}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--muted)}
.kv .v{font-family:var(--mono);text-align:right}
.fbar{display:grid;grid-template-columns:minmax(0,8rem) minmax(0,1fr) 3rem;gap:8px;align-items:center;font-size:12px;margin-bottom:5px}
.fbar .tr{position:relative;height:8px;background:var(--card);border-radius:3px}
.fbar .tr::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--faint)}
.fbar .fi{position:absolute;top:0;bottom:0;background:var(--ink);border-radius:3px}
.fbar .v{font-family:var(--mono);text-align:right}
.split{font-size:12px;margin-bottom:9px}
.split .l{display:flex;justify-content:space-between;color:var(--muted);gap:8px}
.split .b{display:flex;height:7px;border-radius:3px;overflow:hidden;margin-top:3px}
.split .b i{display:block;height:100%}
.small{font-size:12px;color:var(--muted);margin:8px 0 0}

/* record & tables */
.tablewrap{overflow-x:auto;border:1px solid var(--rule);border-radius:10px;background:var(--card)}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th,table.t td{padding:8px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--rule)}
table.t th{font:600 11px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--sunk)}
table.t td{font-family:var(--mono);font-variant-numeric:tabular-nums}
table.t .l{text-align:left;font-family:var(--body)}
table.t tr:last-child td{border-bottom:0}
table.t tr.tot td{font-weight:600;background:var(--sunk)}
.pos{color:var(--play)} .neg{color:var(--accent)} .dim{color:var(--faint)}
.mtabs{display:flex;gap:2px;background:var(--sunk);padding:3px;border-radius:8px;width:max-content;max-width:100%;overflow-x:auto;margin:6px 0 12px}
.mtabs button{border:0;background:none;padding:5px 12px;border-radius:6px;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
.mtabs button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0}
@media (max-width:640px){.summary{grid-template-columns:1fr}}
.summary>div{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:12px 14px}
.summary .k{font-size:12px;color:var(--muted)}
.summary .v{font:500 20px var(--mono);margin-top:2px}
.summary .s{font-size:12px;color:var(--muted)}
details.more{margin-top:14px}
details.more summary{cursor:pointer;font-size:14px;font-weight:500}
.layers{display:grid;gap:16px;max-width:74ch;padding:0;list-style:none;counter-reset:s;margin-top:18px}
.layers li{counter-increment:s;display:grid;grid-template-columns:2.6rem 1fr;gap:8px}
.layers li::before{content:counter(s,decimal-leading-zero);font:900 24px/1.1 var(--display);color:var(--accent)}
.layers b{display:block;margin-bottom:2px}
footer{margin-top:44px;font-size:12px;color:var(--muted);border-top:1px solid var(--rule);padding-top:12px}
</style>


</head>
<body>
<header class="top"><div class="in">
  <div class="brand">Gap<span>/</span>Board<span id="labtag" style="color:var(--muted);font-size:.6em;margin-left:.35em"></span></div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <label class="search" for="q"><input id="q" type="search" placeholder="Find a team" autocomplete="off" aria-label="Find a team"></label>
</div></header>
<div class="wrap"><main id="main"></main>
<footer>Projections are model output, not betting advice. Every number comes from the model; nothing is hand-entered. <span id="upd"></span></footer></div>

const MODE = "public";
const TABS = [["nfl","NFL"],["cfb","College"],["nba","NBA"],["record", MODE==="lab" ? "Backtest" : "Record"],["how", MODE==="lab" ? "Method" : "About"]];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const n1 = n => (+n).toFixed(1).replace(/\.0$/,"");
const sgn = n => (n > 0 ? "+" : n < 0 ? "−" : "") + n1(Math.abs(n));
const pct = p => (p*100).toFixed(1) + "%";
const pct0 = p => Math.round(p*100) + "%";
const odds = o => (o > 0 ? "+" : "−") + Math.abs(o);
const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;

let state = {tab:"nfl", show:"all", q:"", rmkt:{}};
try { const s = JSON.parse(localStorage.getItem("gapboard3") || "{}"); if (s.show) state.show = s.show; } catch(e){}
const hh = location.hash.slice(1); if (TABS.some(t => t[0]===hh)) state.tab = hh;
const open = new Set();
function save(){ try{ localStorage.setItem("gapboard3", JSON.stringify({show:state.show})); }catch(e){} }

/* ---------- helpers that read a game ---------- */
const A = g => g.away_abbr || g.away, H = g => g.home_abbr || g.home;
function lineTxt(m, g){ if (m == null) return null; if (Math.abs(m) < .25) return "Pick'em"; return `${m>0?H(g):A(g)} −${n1(Math.abs(m))}`; }
const abbrOf = (g, team) => team === g.home ? H(g) : team === g.away ? A(g) : team;
const spreadPlay = g => g.pick && g.pick.bet;
const totalPlay = g => g.ou && g.ou.units > 0;
const mlPlay = g => g.ml && g.ml.bet;
const anyPlay = g => spreadPlay(g) || totalPlay(g) || mlPlay(g);
const sharp = g => g.splits && g.splits.sharp_side;

function plays(S){
  const out = [];
  for (const g of S.board){
    if (spreadPlay(g)) out.push({g, mk:"Spread", pick:`${g.pick.team} ${g.pick.num===0?"PK":sgn(g.pick.num)}`, price:"−110", why:`${pct(g.pick.p)} to cover`, size:`${g.pick.units}u · Kelly ${g.pick.kelly}%`});
    if (totalPlay(g)) out.push({g, mk:"Total", pick:`${g.ou.side} ${g.total_line}`, price:"−110", why:`${pct(g.ou.p)} to hit`, size:`${g.ou.units}u`});
    if (mlPlay(g)) out.push({g, mk:"Moneyline", pick:g.ml.team, price:odds(g.ml.odds), why:`${pct0(g.ml.p)} vs market ${pct0(g.ml.mkt_p)} · EV +${(g.ml.ev*100).toFixed(1)}%`, size:`${g.ml.units}u · Kelly ${g.ml.kelly}%`});
  }
  return out;
}

/* ---------- board ---------- */
const leanTag = (txt, p) => `<span class="tag lean">Lean ${esc(txt)}${p ? ` <span class="p">· ${esc(p)}</span>` : ""}</span>`;
const playTag = (txt, size) => `<span class="tag play">PLAY · ${esc(txt)} · ${esc(size)}</span>`;
function cellSpread(g){
  const top = g.line != null ? lineTxt(g.line, g) : "No line";
  const sh = g.sharp && g.sharp.line != null ? ` · Circa ${lineTxt(g.sharp.line, g)}` : "";
  const mv = g.move && g.move.open_line != null && g.move.open_line !== g.line ? ` · Opened ${lineTxt(g.move.open_line, g)}` : "";
  const sub = `Model ${lineTxt(g.model_margin, g)}${sh}${mv}`;
  let tag = "", play = false;
  if (g.pick && g.gap != null && Math.abs(g.gap) >= .25) {
    const side = `${abbrOf(g, g.pick.team)} ${g.pick.num === 0 ? "PK" : sgn(g.pick.num)}`;
    play = !!g.pick.bet;
    tag = play ? playTag(side, `${g.pick.units}u`) : leanTag(side, g.pick.p != null ? pct0(g.pick.p) : null);
  } else if (g.line != null) tag = `<span class="tag pass">No lean</span>`;
  return `<div class="mkt${play?" is-play":""}"><span class="mlabel">Spread</span><div class="big">${esc(top)}</div><div class="sub">${esc(sub)}</div>${tag}</div>`;
}
function cellTotal(g){
  const top = g.total_line != null ? `O/U ${g.total_line}` : "No line";
  const sub = `Model ${n1(g.model_total)}${g.sharp && g.sharp.total != null ? ` · Circa ${g.sharp.total}` : ""}${g.move && g.move.open_total != null && g.move.open_total !== g.total_line ? ` · Opened ${g.move.open_total}` : ""}`;
  let tag = "", play = false;
  if (g.total_line != null && Math.abs(g.model_total - g.total_line) >= .25) {
    const side = g.ou ? g.ou.side : (g.model_total > g.total_line ? "Over" : "Under");
    play = !!(g.ou && g.ou.units > 0);
    tag = play ? playTag(`${side} ${g.total_line}`, `${g.ou.units}u`) : leanTag(`${side} ${g.total_line}`, g.ou ? pct0(g.ou.p) : null);
  } else if (g.total_line != null) tag = `<span class="tag pass">No lean</span>`;
  return `<div class="mkt${play?" is-play":""}"><span class="mlabel">Total</span><div class="big">${esc(top)}</div><div class="sub">${esc(sub)}</div>${tag}</div>`;
}
function cellML(g){
  const pw = g.p_win_home;
  const favH = pw >= .5;
  if (!g.ml) return `<div class="mkt"><span class="mlabel">Moneyline</span><div class="big">No line</div><div class="sub">Model ${esc(favH?H(g):A(g))} ${pct0(Math.max(pw,1-pw))}</div></div>`;
  const top = `${A(g)} ${odds(g.ml.away_odds)} · ${H(g)} ${odds(g.ml.home_odds)}`;
  const sub = `Model ${favH?H(g):A(g)} ${pct0(Math.max(pw,1-pw))}`;
  const ev = `EV ${g.ml.ev>=0?"+":"−"}${Math.abs(g.ml.ev*100).toFixed(1)}%`;
  const side = `${abbrOf(g,g.ml.team)} ${odds(g.ml.odds)}`;
  const play = !!g.ml.bet;
  const tag = play ? playTag(side, `${g.ml.units}u`) : leanTag(side, ev);
  return `<div class="mkt${play?" is-play":""}"><span class="mlabel">Moneyline</span><div class="big">${esc(top)}</div><div class="sub">${esc(sub)}</div>${tag}</div>`;
}
function whenTxt(g){
  if (g.tbd) return `<b>TBA</b>`;
  const d = new Date(g.kickoff);
  return `<b>${d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit",timeZone:tz})}</b>${d.toLocaleTimeString(undefined,{timeZoneName:"short",timeZone:tz}).split(" ").pop()}`;
}
function factorBars(f){
  const it = Object.entries(f||{}).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1]));
  if (!it.length) return `<p class="small">No factor moved this game.</p>`;
  const mx = Math.max(3, ...it.map(x=>Math.abs(x[1])));
  return it.map(([k,v]) => { const w = Math.abs(v)/mx*50, l = v>=0?50:50-w;
    return `<div class="fbar"><span>${esc(k)}</span><span class="tr"><span class="fi" style="left:${l}%;width:${w}%"></span></span><span class="v">${sgn(v)}</span></div>`; }).join("");
}
function splitBar(label, a, b, an, bn){
  return `<div class="split"><div class="l"><span>${esc(label)}</span><span>${esc(an)} ${a}% · ${esc(bn)} ${b}%</span></div><div class="b"><i style="width:${a}%;background:var(--bar-a)"></i><i style="width:${b}%;background:var(--bar-b)"></i></div></div>`;
}
function detail(g){
  const qb = g.qb || {}, sp = g.splits;
  const nums = [
    ["Projected score", `${A(g)} ${n1(g.proj_away)} · ${H(g)} ${n1(g.proj_home)}`],
    ["DraftKings line", g.line!=null ? lineTxt(g.line,g) : "not posted"],
    g.move && g.move.open_line!=null ? ["DraftKings opener", `${lineTxt(g.move.open_line,g)}${g.move.open_total!=null?` · O/U ${g.move.open_total}`:""} (${new Date(g.move.since).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"})})`] : null,
    g.sharp && g.sharp.line!=null ? ["Circa line (sharp)", lineTxt(g.sharp.line,g)] : null,
    g.sharp && g.sharp.total!=null ? ["Circa total", String(g.sharp.total)] : null,
    g.sharp && g.sharp.ml_home!=null ? ["Circa moneyline", `${A(g)} ${odds(g.sharp.ml_away)} · ${H(g)} ${odds(g.sharp.ml_home)}`] : null,
    ["Model line", lineTxt(g.model_margin,g)],
    g.blend!=null ? ["Market-adjusted line", lineTxt(g.blend,g)] : null,
    g.pick && g.pick.p!=null ? ["Cover chance", `${abbrOf(g,g.pick.team)} ${pct(g.pick.p)}`] : null,
    g.pick && g.pick.bet ? ["Spread stake", `${g.pick.units}u · Kelly ${g.pick.kelly}%`] : null,
    ["Win chance", `${g.p_win_home>=.5?H(g):A(g)} ${pct(Math.max(g.p_win_home,1-g.p_win_home))}`],
    g.ml ? ["Market win chance (no vig)", `${abbrOf(g,g.ml.team)} ${pct(g.ml.mkt_p)}`] : null,
    g.ml && g.ml.bet ? ["Moneyline stake", `${g.ml.units}u · Kelly ${g.ml.kelly}%`] : null,
    ["Model total", `${n1(g.model_total)}${g.total_line!=null?` vs ${g.total_line}`:""}`],
    g.ou ? ["Total lean", `${g.ou.side} ${pct(g.ou.p)}`] : null,
    qb.away ? ["Quarterbacks", `${qb.away} · ${qb.home}`] : null,
  ].filter(Boolean);
  const notes = [qb.note, g.weather ? `Weather: ${g.weather}` : null,
    sharp(g) ? `Money vs bets: money runs ${g.splits.sharp_gap} points heavier than tickets on ${g.splits.sharp_side==="home"?H(g):A(g)}.` : null,
    g.move && g.move.rlm ? `Reverse line movement: most tickets are on ${g.move.rlm==="home"?A(g):H(g)}, but the line has moved toward ${g.move.rlm==="home"?H(g):A(g)} since it opened. Often a sign of sharp money. Shown for context; not used in the math.` : null,
    g.avail_note ? `Ruled out: ${g.avail_note}.` : null,
    g.injuries_note && MODE==="lab" ? g.injuries_note : null,
    MODE==="lab" && g.h2h_n ? `${g.h2h_n} recent meeting${g.h2h_n>1?"s":""} in the head-to-head history.` : null
  ].filter(Boolean);
  let spl = `<p class="small">No DraftKings splits captured for this game.</p>`;
  if (sp) {
    spl = splitBar("Spread · bets", sp.sp_bets_away, 100-sp.sp_bets_away, A(g), H(g)) + splitBar("Spread · money", sp.sp_handle_away, 100-sp.sp_handle_away, A(g), H(g))
      + (sp.over_bets!=null ? splitBar("Total · bets", sp.over_bets, 100-sp.over_bets, "Over", "Under") + splitBar("Total · money", sp.over_handle, 100-sp.over_handle, "Over", "Under") : "")
      + `<p class="small">${sp.thin ? "Thin action so far (a side at 0% or 100%), so treat as early." : sp.sharp_side ? `Money runs ${sp.sharp_gap} points heavier than bets on ${esc(sp.sharp_side==="home"?H(g):A(g))}, a common sign of larger, sharper bets. Shown for context; not yet used in the math.` : "No money-vs-bets gap worth flagging."}</p>`;
  }
  return `<div class="detail">
    <div><h4>The numbers</h4>${nums.map(([k,v]) => `<div class="kv"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>`).join("")}</div>
    <div>${MODE==="lab" ? `<h4>What moved the margin</h4>${factorBars(g.factors)}<p class="small">Points toward ${esc(H(g))} (+) or ${esc(A(g))} (−).</p>` : `<h4>Notes</h4>`}${notes.length ? notes.map(n => `<p class="small">${esc(n)}</p>`).join("") : (MODE==="lab" ? "" : `<p class="small">Nothing unusual for this game.</p>`)}</div>
    <div><h4>DraftKings splits</h4>${spl}</div></div>`;
}
function fullLine(m, g){ if (m == null) return null; if (Math.abs(m) < .25) return "Pick'em"; return `${m>0?g.home:g.away} −${n1(Math.abs(m))}`; }
function pickRow(g){
  if (g.line == null) return `<span class="pk none">No line posted yet</span>`;
  if (!g.pick || g.gap == null || Math.abs(g.gap) < .25) return `<span class="pk none">No pick: model agrees with the line</span>`;
  const n = g.pick.num, num = Math.abs(n) < .25 ? "PK" : sgn(n);
  return `<span class="pk">${esc(g.pick.team)} ${num} <span class="gap">(${n1(Math.abs(g.gap))})</span></span>`
    + (g.pick.bet ? playTag("Spread", `${g.pick.units}u`) : "");
}
function gameRow(g){
  const favH = g.model_margin >= 0;
  const isOpen = open.has(g.id);
  const d = new Date(g.kickoff);
  const time = g.tbd ? "Time TBA" : d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit",timeZoneName:"short",timeZone:tz});
  const also = [];
  if (totalPlay(g)) also.push(playTag(`${g.ou.side} ${g.total_line}`, `${g.ou.units}u`));
  if (mlPlay(g)) also.push(playTag(`${abbrOf(g,g.ml.team)} ${odds(g.ml.odds)} ML`, `${g.ml.units}u`));
  return `<article class="game${anyPlay(g)?" has-play":""}${isOpen?" open":""}" id="g-${g.id}">

        <div class="tm${favH?"":" dog"}"><span class="n">${esc(g.home)}<span class="rec">${esc(g.home_rec)}</span></span><span class="s">${n1(g.proj_home)}</span></div>
      </div>

        <div><div class="k">Model line</div><div class="v model">${esc(fullLine(g.model_margin,g))}</div></div>
      </div>

      ${also.length ? `<div class="also">${also.join("")}</div>` : ""}

    </div>

      <div class="stamp">Lines and splits: DraftKings, ${new Date(DATA.splits_captured).toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})}</div></div>
    <p class="lede">${lede}</p>
    <section class="plays"><div class="ph"><b>This week's plays</b><span>${P.length ? `${P.length} flagged · tap one to jump to the game` : "None flagged"}</span></div>
      ${P.length ? `<div>${P.map(p => `<div class="prow" role="button" tabindex="0" data-jump="${p.g.id}"><span class="mk">${p.mk}</span><span class="pick"><b>${esc(p.pick)}</b> <span class="num">${esc(p.price)}</span><small>${esc(p.g.away)} at ${esc(p.g.home)}</small></span><span class="why">${esc(p.why)}</span><span class="size">${esc(p.size)}</span></div>`).join("")}</div>`
        : `<div class="empty">Nothing clears the filter this week${key==="nba"?" (NBA stakes aren't calibrated yet)":""}.</div>`}
    </section>
    ${notes ? `<div class="callout">${notes}</div>` : ""}
    <div class="filters" role="group" aria-label="Filter games">${chip("all","All games")}${chip("play","Any play")}${chip("spread","Spread plays")}${chip("total","Total plays")}${chip("ml","Moneyline plays")}${chip("sharp","Money vs bets")}</div>`;
  const days = new Map();
  games.forEach(g => { const d = new Date(g.kickoff).toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric",timeZone:tz}); if(!days.has(d)) days.set(d, []); days.get(d).push(g); });
  for (const [d, gs] of days) html += `<div class="day"><span>${esc(d)}</span><span>${gs.length} game${gs.length>1?"s":""}</span></div><div class="games">${gs.map(gameRow).join("")}</div>`;
  if (!games.length) html += `<p class="note" style="margin-top:16px">No games match${q?` “${esc(state.q)}”`:""}.</p>`;
  return html;
}

/* ---------- record ---------- */
const sum = (a,k) => a.reduce((t,r)=>t+(r[k]||0),0);
function trackerSummary(P){
  const done = P.filter(p => ["W","L","P"].includes(p.result));
  const W = done.filter(p=>p.result==="W").length, L = done.filter(p=>p.result==="L").length, Pu = done.filter(p=>p.result==="P").length;
  const units = done.reduce((t,p)=>t+(p.profit||0)*p.units,0), risk = done.filter(p=>p.result!=="P").reduce((t,p)=>t+p.units,0);
  return {done, W, L, Pu, units, risk, pend: P.filter(p=>p.result==="pending")};
}
function marketGrid(P){
  const rows = [];
  for (const sp of ["nfl","cfb","nba"]) for (const m of ["Spread","Total","Moneyline"]) {
    const x = P.filter(p=>p.sport===sp && p.market===m); if (!x.length) continue;
    const t = trackerSummary(x);
    const c = x.filter(p => p.clv != null && !isNaN(p.clv)), beat = c.filter(p => p.clv > 0).length, lost = c.filter(p => p.clv < 0).length;
    rows.push(`<tr><td class="l">${{nfl:"NFL",cfb:"College",nba:"NBA"}[sp]}</td><td class="l">${m}</td><td>${t.W}-${t.L}${t.Pu?"-"+t.Pu:""}</td><td>${t.W+t.L?(t.W/(t.W+t.L)*100).toFixed(1)+"%":"—"}</td><td class="${t.units>0?"pos":t.units<0?"neg":""}">${t.units>0?"+":""}${t.units.toFixed(1)}</td><td>${c.length?`${beat}-${lost}`:"—"}</td><td>${t.pend.length}</td></tr>`);
  }
  return `<div class="tablewrap"><table class="t"><thead><tr><th class="l">Sport</th><th class="l">Market</th><th>Record</th><th>Win %</th><th>Units</th><th title="Picks where the line moved our way after posting, vs against us">Beat the close</th><th>Open</th></tr></thead><tbody>${rows.join("")}</tbody></table></div>
  <p class="note">Beat the close: how often the number moved our way between posting and kickoff (closing line, or the last DraftKings capture before the game). Over a season this is the earliest sign of a real edge, well before win-loss records settle down.</p>`;
}
function liveRecordPage(){
  const all = DATA.picks || [];

  const P = track === "plays" ? all.filter(p => p.play) : all;
  const T = trackerSummary(P);
  const launched = new Date(DATA.launched+"T12:00:00").toLocaleDateString(undefined,{month:"long",day:"numeric",year:"numeric"});
  const row = p => `<tr><td class="l">${esc(p.sport.toUpperCase())}</td><td class="l">${esc(p.market)}</td><td class="l"><b>${esc(p.pick)}</b>${p.play&&track==="all"?' <span class="tag play" style="margin:0 0 0 4px">PLAY</span>':""}<div class="dim" style="font-size:12px">${esc(p.away)} at ${esc(p.home)}</div></td><td>${p.price>0?"+":""}${p.price}</td><td>${p.units}u</td><td class="l ${p.result==="W"?"pos":p.result==="L"?"neg":"dim"}">${{W:"Won",L:"Lost",P:"Push",pending:"Pending"}[p.result]}</td></tr>`;
  const table = (rows, empty) => rows.length ? `<div class="tablewrap"><table class="t"><thead><tr><th class="l">Sport</th><th class="l">Market</th><th class="l">Pick</th><th>Price</th><th>Stake</th><th class="l">Result</th></tr></thead><tbody>${rows.map(row).join("")}</tbody></table></div>` : `<p class="note">${empty}</p>`;
  const intro = track === "plays"

    : "Every side the model leans on, for every game with a line: spread, total and moneyline. Each is graded at 1 unit (−110 for spreads and totals, the posted price for moneylines) so you can see how the model's raw opinion does, threshold or not.";
  const openList = track === "plays" ? table(T.pend, "No open plays right now.")
    : `<details class="more"><summary>Show all ${T.pend.length} open picks</summary>${table(T.pend, "")}</details>`;
  return `<div class="head"><div><div class="eyebrow">Tracked from ${esc(launched)}</div><h1>The record</h1></div></div>
    <div class="mtabs" role="tablist" style="margin-top:14px"><button data-track="plays" aria-selected="${track==="plays"}">Plays</button><button data-track="all" aria-selected="${track==="all"}">All model picks</button></div>
    <p class="lede" style="margin-top:4px">${intro}</p>
    <div class="summary"><div><div class="k">Record</div><div class="v">${T.W}-${T.L}${T.Pu?"-"+T.Pu:""}</div><div class="s">${T.done.length ? `${(T.W/Math.max(T.W+T.L,1)*100).toFixed(1)}% of graded ${track==="plays"?"plays":"picks"}` : "nothing graded yet"}</div></div>
      <div><div class="k">Units</div><div class="v ${T.units>0?"pos":T.units<0?"neg":""}">${T.units>0?"+":""}${T.units.toFixed(1)}u</div><div class="s">${T.risk?`${(T.units/T.risk*100).toFixed(1)}% return on ${T.risk}u risked`:(track==="plays"?"flat stakes, 1 to 3 units":"1 unit per pick")}</div></div>
      <div><div class="k">Open</div><div class="v">${T.pend.length}</div><div class="s">waiting on results</div></div></div>
    <h2>By sport and market</h2>${marketGrid(P)}
    <h2>Open ${track==="plays"?"plays":"picks"}</h2>${openList}
    <h2>Graded ${track==="plays"?"plays":"picks"}</h2>${table(T.done.slice().reverse(), "Nothing graded yet. The first results land after this week's games.")}`;
}
function histTable(rows, sport){
  const hasL = rows.some(r => r.mae_market != null);
  const tot = k => sum(rows,k);
  const wl = (r,k) => (r[k+"_W"]||0)+(r[k+"_L"]||0) ? `${r[k+"_W"]}-${r[k+"_L"]} <span class="${(r[k+"_units"]||0)>=0?"pos":"neg"}">${(r[k+"_units"]||0)>0?"+":""}${(r[k+"_units"]||0).toFixed(1)}</span>` : `<span class="dim">—</span>`;
  const head = `<tr><th class="l">Season</th><th>Games</th><th>Avg miss · model</th>${hasL?"<th>Avg miss · line</th><th>Spread plays</th><th>Total plays</th>":"<th>Winners picked</th>"}${sport==="nfl"?"<th>Moneyline plays</th>":""}${hasL?"<th>Weight on model</th>":""}</tr>`;
  const body = rows.map(r => `<tr><td class="l">${r.season}</td><td>${r.games}</td><td>${r.mae_model.toFixed(2)}</td>${hasL?`<td>${r.mae_market!=null?r.mae_market.toFixed(2):"—"}</td><td>${wl(r,"sp")}</td><td>${wl(r,"to")}</td>`:`<td>${(r.su*100).toFixed(1)}%</td>`}${sport==="nfl"?`<td>${wl(r,"ml")}</td>`:""}${hasL?`<td>${r.w!=null?r.w.toFixed(2):"—"} / ${r.w_t!=null?r.w_t.toFixed(2):"—"}</td>`:""}</tr>`).join("");
  const T = {sp_W:tot("sp_W"),sp_L:tot("sp_L"),sp_units:tot("sp_units"),to_W:tot("to_W"),to_L:tot("to_L"),to_units:tot("to_units"),ml_W:tot("ml_W"),ml_L:tot("ml_L"),ml_units:tot("ml_units")};
  const games = tot("games");
  const totRow = `<tr class="tot"><td class="l">All</td><td>${games.toLocaleString()}</td><td></td>${hasL?`<td></td><td>${wl(T,"sp")}</td><td>${wl(T,"to")}</td>`:`<td>${(rows.reduce((t,r)=>t+r.su*r.games,0)/games*100).toFixed(1)}%</td>`}${sport==="nfl"?`<td>${wl(T,"ml")}</td>`:""}${hasL?"<td></td>":""}</tr>`;
  return `<div class="tablewrap"><table class="t"><thead>${head}</thead><tbody>${body}${totRow}</tbody></table></div>`;
}
function labPage(){
  const sec = (k, label, rows, note) => `<h2>${label}</h2><p class="note">${note}</p>${histTable(rows, k)}`;
  const N = DATA.nfl_hist, Cf = DATA.cfb_hist, B = DATA.nba_hist;
  return `<div class="head"><div><div class="eyebrow">Research</div><h1>Backtest</h1></div></div>
    <p class="lede">Each season is scored by a model that chose its factors, fit its weights and calibrated its market filter using only earlier seasons (the last 12 for factors, the last 4 for the market filter). Units use flat 1–3u sizing at −110 for spreads and totals and the closing price for moneylines.</p>
    ${sec("nfl","NFL",N,`Scored ${N[0].season}–${N[N.length-1].season}. Ratings from play-by-play back to 1999; injuries from 2013.`)}
    ${sec("cfb","College football",Cf,`Scored ${Cf[0].season}–${Cf[Cf.length-1].season}. Lines from seasons where the source's lines missed results by more than 14 points on average (2005–08, 2012) are not used, so 2012 has no market grading.`)}
    ${sec("nba","NBA",B,`Scored ${B[0].season}–${B[B.length-1].season}. No historical NBA lines, so graded on winners picked.`)}
    <h2>Factors each season's model chose</h2>
    <div class="tablewrap"><table class="t"><thead><tr><th class="l">Season</th><th class="l">NFL</th><th class="l">College</th><th class="l">NBA</th></tr></thead><tbody>
    ${[...new Set([...N,...Cf,...B].map(r=>r.season))].sort().map(s => { const f = a => { const r = a.find(x=>x.season===s); return r ? esc(r.groups.filter(x=>!/^Baseline/.test(x)).join(", ")||"Baseline only") : "—"; };
      return `<tr><td class="l">${s}</td><td class="l" style="white-space:normal">${f(N)}</td><td class="l" style="white-space:normal">${f(Cf)}</td><td class="l" style="white-space:normal">${f(B)}</td></tr>`; }).join("")}
    </tbody></table></div>`;
}
function recordPage(){ return MODE === "lab" ? labPage() + `<h2>Live record</h2>` + liveRecordPage().replace(/<div class="head">[\s\S]*?<\/p>/, "") : liveRecordPage(); }
function howPage(){
  if (MODE !== "lab") return `<div class="head"><div><div class="eyebrow">About</div><h1>How it works</h1></div></div>
    <p class="lede">Gap Board projects a score for every NFL, college football and NBA game, compares it with the DraftKings line, and posts a play only when the edge is big enough to beat the cost of betting.</p>
    <ol class="layers">
      <li><div><b>Team ratings</b>Every team is rated from play-by-play data and adjusted for the opponents it has faced.</div></li>
      <li><div><b>Game context</b>Each matchup is adjusted for the circumstances of that game.</div></li>
      <li><div><b>Market check</b>The projection is weighed against the betting market. Spreads and totals become plays above a 52.4% chance to win at −110; moneylines when the expected return at the posted price is 5% or more.</div></li>
      <li><div><b>Stakes</b>1 to 3 units by the size of the edge. Every play is graded on the Record tab.</div></li>
    </ol>
    <p class="note" style="margin-top:22px">Lines and betting splits: DraftKings. Projections are model output, not betting advice.</p>`;
  return `<div class="head"><div><div class="eyebrow">Method</div><h1>How it works</h1></div></div>
    <ol class="layers">
      <li><div><b>Baseline engine</b>Opponent-adjusted offense, defense and pace ratings from play-by-play (NFL since 1999, college since 2004) and box scores (NBA since 2003), recency-weighted, with last season discounted.</div></li>
      <li><div><b>Context layer</b>Candidate factors: box-score matchups, head-to-head, rest/travel/altitude, team home edge, starting QB, non-QB injuries (snap-weighted regulars missing), weather, and NBA player availability and roster changes. Each season's model keeps only the groups that improve leave-one-season-out accuracy on the 12 seasons before it.</div></li>
      <li><div><b>Market filter</b>Weight on the model vs the line, the spread of outcomes and the win-probability curve are all fit on the last 4 seasons before the one being projected. Spreads/totals are plays at 52.38%+; moneylines at 5%+ expected value.</div></li>
      <li><div><b>Sizing</b>1–3 units by edge; quarter-Kelly shown on each game.</div></li>
    </ol>
    <h2>Fixed in this version</h2>
    <p class="note">College team IDs were stored as decimals in ten older seasons, so ratings for 2006–09, 2011–12 and 2014–16 were built on mismatched teams; IDs are now normalized. Older college lines are filled from each game's play-by-play, and seasons with unreliable lines are excluded from market calibration. The market filter now calibrates on recent seasons only, after older, softer lines inflated its trust in the model. NFL snap data with swapped teams (some Super Bowls) is detected and skipped. NBA injuries due back before game day are ignored.</p>
    <h2>Sources</h2>
    <p class="note">nflverse (NFL play-by-play, schedules, lines, depth charts, injuries, snap counts); sportsdataverse/ESPN (college and NBA play-by-play, box scores, schedules, rosters, injuries, lines); DraftKings via VSiN (current lines and splits); National Weather Service.</p>`;
}

  $("#main").innerHTML = state.tab === "record" ? recordPage() : state.tab === "how" ? howPage() : board(state.tab);
}
$("#tabs").addEventListener("click", e => { const k = e.target.closest("button")?.dataset.k; if(!k) return; state.tab = k; history.replaceState(null,"","#"+k); render(); window.scrollTo({top:0}); });
$("#q").addEventListener("input", e => { state.q = e.target.value; render(); });
$("#main").addEventListener("click", e => {
  const c = e.target.closest("[data-show]"); if (c) { state.show = c.dataset.show; save(); render(); return; }
  const tk = e.target.closest("[data-track]"); if (tk) { state.track = tk.dataset.track; render(); return; }
  const rm = e.target.closest("[data-rm]"); if (rm) { const [s,m] = rm.dataset.rm.split(":"); state.rmkt[s] = m; render(); return; }
  const j = e.target.closest("[data-jump]");
  if (j) { const id = j.dataset.jump; state.show = "all"; state.q = ""; $("#q").value = ""; open.add(id); render();
    const el = document.getElementById("g-"+id); if (el) el.scrollIntoView({block:"center", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"}); return; }
  const l = e.target.closest("[data-toggle]");
  if (l) { const id = l.dataset.toggle; open.has(id) ? open.delete(id) : open.add(id); render(); const b = document.querySelector(`[data-toggle="${id}"]`); if (b) b.focus({preventScroll:true}); }
});
$("#main").addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches(".prow[data-jump]")) { e.preventDefault(); e.target.click(); }
});
$("#labtag").textContent = MODE === "lab" ? "Lab" : "";
$("#upd").textContent = "Model run " + new Date(DATA.updated).toLocaleString(undefined,{weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit",timeZoneName:"short"}) + ".";
render();
</script>

</body>
</html>
