<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Weekly NFL, college football and NBA projections against the DraftKings line, with posted plays and a public record.">
<meta property="og:title" content="Gap Board">
<meta property="og:description" content="Weekly NFL, college football and NBA projections against the DraftKings line, with posted plays and a public record.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#1b2530">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231b2530'/%3E%3Cpath d='M19 6 13 26' stroke='%23c2410c' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Gap Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a betting sheet. Sticky header (sport + search), a plays summary, then one row per
   game with the three markets in aligned columns — spread, total, moneyline — so the eye can
   run down any one market. Rows expand for the reasoning. */
:root{
  --bg:#f5f6f8; --card:#ffffff; --sunk:#eef0f3; --ink:#1b2530; --muted:#667585; --faint:#98a3af; --rule:#e2e6eb;
  --accent:#c2410c; --play:#15803d; --play-bg:#e7f5ec; --pass-bg:#f1f3f5; --sharp-bg:#fdeee6;
  --bar-a:#1b2530; --bar-b:#c9d2dc;
  --display:"Big Shoulders Display","Oswald","Arial Narrow",Impact,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161c; --card:#181f27; --sunk:#141a21; --ink:#e4e9ee; --muted:#9aa7b4; --faint:#6b7885; --rule:#26303b;
  --accent:#fb8a4c; --play:#4ade80; --play-bg:#163222; --pass-bg:#1d252e; --sharp-bg:#3a2417;
  --bar-a:#e4e9ee; --bar-b:#3a4654; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161c; --card:#181f27; --sunk:#141a21; --ink:#e4e9ee; --muted:#9aa7b4; --faint:#6b7885; --rule:#26303b;
  --accent:#fb8a4c; --play:#4ade80; --play-bg:#163222; --pass-bg:#1d252e; --sharp-bg:#3a2417;
  --bar-a:#e4e9ee; --bar-b:#3a4654; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--body);padding-inline:16px;padding-block:0 56px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1040px;margin:0 auto}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-inline:-16px;padding:12px 16px;border-bottom:1px solid var(--rule)}
.top .in{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font:900 24px/1 var(--display);letter-spacing:.02em;text-transform:uppercase;margin-right:auto;color:var(--ink);text-decoration:none;cursor:pointer}
.brand span{color:var(--accent)}
.tabs{display:flex;gap:2px;background:var(--sunk);padding:3px;border-radius:8px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{white-space:nowrap;flex:0 0 auto;border:0;background:none;padding:6px 12px;border-radius:6px;font-weight:500;font-size:14px;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.search{position:relative;flex:0 1 220px;min-width:0}
.search input{width:100%;border:1px solid var(--rule);background:var(--card);border-radius:8px;padding:7px 10px;font-size:14px}
@media (max-width:640px){.brand{font-size:21px}.search{flex-basis:100%}.tabs button{padding:6px 10px}}

/* page head */
.head{padding-block:24px 4px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.eyebrow{font:600 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font:800 clamp(30px,6vw,42px)/1 var(--display);text-transform:uppercase;letter-spacing:.01em;margin:4px 0 0}
.stamp{font-size:13px;color:var(--muted);text-align:right}
p.lede{color:var(--muted);max-width:70ch;margin:10px 0 0;font-size:14px}
h2{font:600 18px var(--body);margin:36px 0 10px}
h3{font:600 15px var(--body);margin:22px 0 8px}

/* plays summary */
.plays{background:var(--card);border:1px solid var(--rule);border-radius:10px;margin-top:18px;overflow:hidden}
.plays .ph{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:12px 16px;border-bottom:1px solid var(--rule)}
.plays .ph b{font-size:15px}
.plays .ph span{font-size:13px;color:var(--muted);text-align:right}
.prow{display:grid;grid-template-columns:6rem minmax(0,1fr) minmax(0,15rem) minmax(0,9.5rem);grid-template-areas:"mk pick why size";gap:4px 14px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--rule);cursor:pointer;font-size:14px}
.prow:last-child{border-bottom:0}
.prow:hover{background:var(--sunk)}
.prow .mk{grid-area:mk;font-size:12px;color:var(--muted)}
.prow .pick{grid-area:pick;min-width:0}
.prow .pick small{display:block;font-size:12px;color:var(--muted)}
.prow .why{grid-area:why;font-size:13px;color:var(--muted);text-align:right}
.prow .size{grid-area:size;font-family:var(--mono);text-align:right;white-space:nowrap}
@media (max-width:640px){.prow{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"mk size" "pick pick" "why why"}.prow .why{text-align:left}}
.plays .empty{padding:14px 16px;color:var(--muted);font-size:14px}
.note{font-size:13px;color:var(--muted);max-width:72ch}
.callout{font-size:13px;color:var(--muted);background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:10px 14px;margin-top:12px;max-width:80ch}

/* filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 4px}
.chip{border:1px solid var(--rule);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .c{font-family:var(--mono);margin-left:4px;opacity:.75}

/* board: one card per game. Up front: time, teams, projected score, Vegas line vs model line, the pick
   with the line gap. Everything else sits behind "Game breakdown". */
.day{font:600 13px var(--body);color:var(--muted);margin:22px 0 8px;display:flex;justify-content:space-between}
.games{display:grid;gap:10px}
.game{background:var(--card);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.game.has-play{border-color:var(--play);box-shadow:inset 4px 0 0 var(--play)}
.gc{padding:14px 18px 16px}
.gmeta{display:flex;justify-content:space-between;align-items:center;gap:10px;font:400 12px var(--mono);color:var(--muted);letter-spacing:.02em}
.gmeta .vn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.teams{margin-top:10px;display:grid;gap:6px}
.tm{display:flex;justify-content:space-between;gap:12px;align-items:center}
.tm .who{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:34px;height:34px;flex:0 0 34px;object-fit:contain}
.badge{width:34px;height:34px;flex:0 0 34px;border-radius:50%;background:var(--sunk);border:1px solid var(--rule);display:grid;place-items:center;font:600 10px var(--mono);color:var(--muted);letter-spacing:.02em}
.tm.dog .logo{opacity:.65}
.tm .n{font-weight:600;font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.25}
.tm .rec{display:block;font:400 12px var(--mono);color:var(--faint)}
.tm .s{font:600 20px var(--mono);font-variant-numeric:tabular-nums}
.tm.dog .n,.tm.dog .s{color:var(--muted)}
.lines{display:grid;grid-template-columns:repeat(3,minmax(0,max-content));gap:6px 40px;border-top:1px solid var(--rule);margin-top:14px;padding-top:12px}
.lines .k,.pickrow .k{font:400 11px var(--mono);color:var(--muted);letter-spacing:.02em}
.lines .v{font:500 15px var(--mono);margin-top:2px;white-space:nowrap}
.lines .v.model{color:var(--ink)}
.pickrow{display:flex;align-items:center;flex-wrap:wrap;gap:6px 12px;border-top:1px solid var(--rule);margin-top:12px;padding-top:12px}
.pickrow .pk{font:600 16px var(--body);color:var(--accent)}
.pickrow .pk .gap{font-family:var(--mono);font-weight:500}
.pickrow .pk.none{color:var(--muted);font-weight:500;font-size:14px}
.also{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{display:inline-block;font:600 12px var(--body);padding:2px 8px;border-radius:5px;white-space:nowrap}
.tag.play{background:var(--play);color:var(--card);font-weight:700;letter-spacing:.02em}
.tag.lean{background:var(--pass-bg);color:var(--ink);font-weight:500}
.tag.lean .p{color:var(--muted);font-weight:400}
.tag.pass{background:var(--pass-bg);color:var(--muted);font-weight:500}
.tag.sharp{background:var(--sharp-bg);color:var(--accent)}
.tag.tm{margin-left:4px;font-weight:600;border:1px solid transparent}
.tag.tm.now{background:var(--play-bg);color:var(--play);border-color:var(--play)}
.tag.tm.hold{background:var(--pass-bg);color:var(--muted)}
.tag.tm.caution{background:var(--sharp-bg);color:var(--accent)}
.tag.tm.gone{background:var(--pass-bg);color:var(--faint);text-decoration:line-through}
.pchip .tm{font:600 11px var(--body);margin-top:2px}
.pchip .tm.now{color:var(--play)} .pchip .tm.caution{color:var(--accent)} .pchip .tm.gone,.pchip .tm.hold{color:var(--muted)}
.bd{margin-top:14px;border:1px solid var(--rule);background:var(--sunk);border-radius:7px;padding:8px 14px;font:500 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;color:var(--ink)}
.bd:hover{border-color:var(--muted)}
.game.open .bd{background:var(--ink);color:var(--card);border-color:var(--ink)}
.mkts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:14px 18px;border-top:1px solid var(--rule);background:var(--sunk)}
.mkt{min-width:0;font-size:13px;line-height:1.35;background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:10px 12px}
.mkt.is-play{background:var(--play-bg);border-color:var(--play)}
.mkt .big{font:500 15px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mkt .sub{color:var(--muted);overflow-wrap:anywhere}
.mkt .tag{margin-top:6px;white-space:normal}
.mlabel{display:block;font:600 10px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:3px}
@media (max-width:640px){
  .gc{padding:12px 14px 14px}
  .lines{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px}
  .lines .v{white-space:normal;font-size:14px}
  .mkts{grid-template-columns:1fr;padding:12px 14px}
}

/* detail */
.detail{border-top:1px solid var(--rule);padding:14px 18px 18px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;background:var(--sunk)}
@media (max-width:860px){.detail{grid-template-columns:1fr}}
.detail h4{font:600 12px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:3px 0;border-bottom:1px dashed var(--rule)}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--muted)}
.kv .v{font-family:var(--mono);text-align:right}
.fbar{display:grid;grid-template-columns:minmax(0,8rem) minmax(0,1fr) 3rem;gap:8px;align-items:center;font-size:12px;margin-bottom:5px}
.fbar .tr{position:relative;height:8px;background:var(--card);border-radius:3px}
.fbar .tr::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--faint)}
.fbar .fi{position:absolute;top:0;bottom:0;background:var(--ink);border-radius:3px}
.fbar .v{font-family:var(--mono);text-align:right}
.split{font-size:12px;margin-bottom:9px}
.split .l{display:flex;justify-content:space-between;color:var(--muted);gap:8px}
.split .b{display:flex;height:7px;border-radius:3px;overflow:hidden;margin-top:3px}
.split .b i{display:block;height:100%}
.small{font-size:12px;color:var(--muted);margin:8px 0 0}

/* plays strip, results, countdown, favorites */
.strip{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;margin-top:16px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip .k{flex:0 0 auto;align-self:center;font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.pchip{flex:0 0 auto;display:flex;flex-direction:column;gap:1px;border:1px solid var(--play);background:var(--play-bg);border-radius:10px;padding:7px 12px;cursor:pointer;text-align:left;color:var(--ink);font:inherit}
.pchip b{font-size:14px;white-space:nowrap}
.pchip span{font:400 12px var(--mono);color:var(--muted);white-space:nowrap}
.pchip.res-W{border-color:var(--play)} .pchip.res-L{border-color:var(--accent);background:var(--sharp-bg)}
.gmeta .cd{font-family:var(--mono);color:var(--play)}
.gmeta .live{color:var(--accent);font-weight:600}
.game.started:not(.final) .gc{opacity:.72}
.final-line{display:flex;align-items:center;gap:8px;font:600 12px var(--mono);color:var(--ink)}
.rbadge{display:inline-block;font:700 11px var(--body);padding:1px 7px;border-radius:5px;margin-left:6px}
.rbadge.W{background:var(--play);color:var(--card)} .rbadge.L{background:var(--accent);color:var(--card)} .rbadge.P{background:var(--pass-bg);color:var(--muted)}
.results{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px;font-size:12px;color:var(--muted)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btnrow .bd{margin-top:14px}
.sharebtn{margin-top:14px;border:1px solid var(--play);background:none;border-radius:7px;padding:8px 12px;font:500 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;color:var(--play)}
.flag{margin-top:10px;font-size:13px;color:var(--accent);background:var(--sharp-bg);border-radius:8px;padding:7px 10px}
.star{border:0;background:none;cursor:pointer;font-size:17px;line-height:1;color:var(--faint);padding:0 2px}
.star.on{color:#e0a400}
.gmeta{flex-wrap:wrap}
.gmeta .right{display:flex;align-items:center;gap:10px;margin-left:auto}

/* top 25 */
.t25{background:var(--card);border:1px solid var(--rule);border-radius:12px;overflow:hidden;margin-top:18px}
.t25 .r{display:grid;grid-template-columns:2.6rem 2rem 2.6rem minmax(0,1fr) 6.5rem 7.5rem 6.5rem;gap:4px 14px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--rule)}
.t25 .r:last-child{border-bottom:0}
.t25 .hd{font:600 11px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--faint);background:var(--sunk);padding-block:8px}
.t25 .rk{font:800 24px/1 var(--display);text-align:right}
.t25 .mv{font:500 11px var(--mono);color:var(--faint);text-align:center}
.t25 .mv.up{color:var(--play)} .t25 .mv.dn{color:var(--accent)}
.t25 .nm{min-width:0}
.t25 .nm b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t25 .nm span{font:400 12px var(--mono);color:var(--faint)}
.t25 .num{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.t25 .num small{display:block;font:400 11px var(--body);color:var(--faint)}
@media (max-width:640px){.t25 .r{grid-template-columns:2.2rem 2.4rem minmax(0,1fr) 4.6rem;grid-template-areas:"rk lg nm rt" "rk lg fv vt"}.t25 .rk{grid-area:rk}.t25 .lg{grid-area:lg}.t25 .nm{grid-area:nm}.t25 .rt{grid-area:rt}.t25 .fv{grid-area:fv;text-align:left}.t25 .vt{grid-area:vt}.t25 .mv{display:none}.t25 .hd{display:none}}

/* breakdown extras */
.summ{padding:16px 18px 4px;border-top:1px solid var(--rule);background:var(--sunk);font-size:14px;line-height:1.6}
.summ p{margin:0 0 6px;max-width:80ch}
.summ .dim{color:var(--muted);font-size:13px}
.xtra{display:grid;gap:18px;padding:4px 18px 20px;background:var(--sunk)}
.xtra>*,.two>*{min-width:0}
.xtra h4{font:600 12px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:640px){.two{grid-template-columns:1fr}}
.res{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:4px 0;border-bottom:1px dashed var(--rule)}
.res:last-child{border-bottom:0}
.res b{font:600 12px var(--mono);margin-right:6px}
.res .w{color:var(--play)} .res .l{color:var(--accent)}
.res .sc{font-family:var(--mono)}
.rt td .pc{display:block;font:400 11px var(--body);color:var(--faint)}
.rt td .pc.hi{color:var(--play)} .rt td .pc.lo{color:var(--accent)}
.st-out{color:var(--accent);font-weight:600} .st-q{color:var(--muted)}
.recstrip{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:10px}
.recstrip b{color:var(--ink);font:600 14px var(--mono)}

/* record & tables */
@media (max-width:640px){
  table.t.rec thead{display:none}
  table.t.rec,table.t.rec tbody{display:block}
  table.t.rec tr{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:2px 10px;padding:10px 12px;border-bottom:1px solid var(--rule)}
  table.t.rec tr:last-child{border-bottom:0}
  table.t.rec td{border:0;padding:0;white-space:normal;text-align:left}
  table.t.rec td:nth-child(3){grid-column:1/4;grid-row:1}
  table.t.rec td:nth-child(4){grid-column:4;grid-row:1;text-align:right}
  table.t.rec td:nth-child(1){grid-column:1;grid-row:2;font-size:12px;color:var(--muted)}
  table.t.rec td:nth-child(2){grid-column:2;grid-row:2;font-size:12px;color:var(--muted)}
  table.t.rec td:nth-child(6){grid-column:3;grid-row:2;font-size:12px}
  table.t.rec td:nth-child(5){grid-column:4;grid-row:2;text-align:right;font-size:12px;color:var(--muted)}
}
.tablewrap{overflow-x:auto;border:1px solid var(--rule);border-radius:10px;background:var(--card)}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th,table.t td{padding:8px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--rule)}
table.t th{font:600 11px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--sunk)}
table.t td{font-family:var(--mono);font-variant-numeric:tabular-nums}
table.t .l{text-align:left;font-family:var(--body)}
table.t tr:last-child td{border-bottom:0}
table.t tr.tot td{font-weight:600;background:var(--sunk)}
.pos{color:var(--play)} .neg{color:var(--accent)} .dim{color:var(--faint)}
.mtabs{display:flex;gap:2px;background:var(--sunk);padding:3px;border-radius:8px;width:max-content;max-width:100%;overflow-x:auto;margin:6px 0 12px}
.mtabs button{border:0;background:none;padding:5px 12px;border-radius:6px;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
.mtabs button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0}
@media (max-width:640px){.summary{grid-template-columns:1fr}}
.summary>div{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:12px 14px}

  const files = [];

    <p class="sp-msg small">${canCopy ? "Copy, then paste it into Discord, a text or a post." : "Download the image, then attach it anywhere."}</p></div>`;

function howPage(){
  if (MODE !== "lab") return `<div class="head"><div><div class="eyebrow">About</div><h1>How it works</h1></div></div>
    <p class="lede">Gap Board projects every NFL, college football, NBA, NHL and college basketball game and compares it with the DraftKings line. It only calls a bet when the edge beats the bookmaker's cut.</p>
    <ol class="layers">
      <li><div><b>Reading a game</b>Each card shows DraftKings' line, the model's line and the model's pick. Tap <i>Game breakdown</i> for totals, moneylines, betting splits, team ratings, best prices and recent results.</div></li>
      <li><div><b>Plays and leans</b>The model's number is weighed against the market, using Circa (a sharp sportsbook) when available. A <strong>play</strong> (green) needs a 52.4%+ chance on a spread or total, or a 5%+ expected return on a moneyline, and is sized 1–3 units. Anything less is a <strong>lean</strong>. If the market points the other way, it's a pass.</div></li>
      <li><div><b>Sports</b>Plays: NFL, college football, NBA. Leans only: NHL and college basketball, which haven't beaten past lines in testing yet. NHL puck lines are graded at DraftKings' real price, not −110.</div></li>
      <li><div><b>When picks post</b>${DATA.locked === false ? "The model is still being tuned, so picks update with each run until kickoff." : "Football: Monday morning, plus any game whose line appears later in the week. NBA, NHL and college basketball: daily. Every pick is graded at the first number posted and never changes. A pick found to be posted in error is voided before kickoff and listed on the Record tab."}</div></li>
      <li><div><b>Best price and timing</b>Each pick shows the best price for that side across sportsbooks (DraftKings, FanDuel, BetMGM, BetRivers and more) and the Kalshi and Polymarket prediction markets, fees included. Open plays also get a tag: <i>Bet now</i>, <i>Hold</i>, <i>Caution</i> (the line is moving against it) or <i>Number gone</i> (don't chase).</div></li>
      <li><div><b>The record</b>Every play, every pick at 1 unit, and how often our number beat the closing line: the best long-run sign of a real edge.</div></li>
    </ol>
    <p class="note" style="margin-top:22px">Lines and splits: DraftKings, with Circa as the sharp reference. Best prices: US sportsbooks via The Odds API, plus Kalshi and Polymarket.</p>`;
  return `<div class="head"><div><div class="eyebrow">Method</div><h1>How it works</h1></div></div>
    <ol class="layers">
      <li><div><b>Baseline engine</b>Opponent-adjusted offense, defense and pace ratings from play-by-play (NFL since 1999, college since 2004) and box scores (NBA since 2003), recency-weighted, with last season discounted.</div></li>
      <li><div><b>Context layer</b>Candidate factors: box-score matchups, head-to-head, rest/travel/altitude, team home edge, starting QB, non-QB injuries (snap-weighted regulars missing), weather, and NBA player availability and roster changes. Each season's model keeps only the groups that improve leave-one-season-out accuracy on the 12 seasons before it.</div></li>
      <li><div><b>Market filter</b>Weight on the model vs the line, the spread of outcomes and the win-probability curve are all fit on the last 4 seasons before the one being projected. Spreads/totals are plays at 52.38%+; moneylines at 5%+ expected value.</div></li>
      <li><div><b>Sizing</b>1–3 units by edge; quarter-Kelly shown on each game.</div></li>
    </ol>
    <h2>Fixed in this version</h2>
    <p class="note">College team IDs were stored as decimals in ten older seasons, so ratings for 2006–09, 2011–12 and 2014–16 were built on mismatched teams; IDs are now normalized. Older college lines are filled from each game's play-by-play, and seasons with unreliable lines are excluded from market calibration. The market filter now calibrates on recent seasons only, after older, softer lines inflated its trust in the model. NFL snap data with swapped teams (some Super Bowls) is detected and skipped. NBA injuries due back before game day are ignored.</p>
    <h2>Sources</h2>
    <p class="note">nflverse (NFL play-by-play, schedules, lines, depth charts, injuries, snap counts); sportsdataverse/ESPN (college and NBA play-by-play, box scores, schedules, rosters, injuries, lines); DraftKings via VSiN (current lines and splits); National Weather Service.</p>`;
}
/* ---------- shell ---------- */
function render(){
  $("#tabs").innerHTML = TABS.map(([k,l]) => `<button role="tab" aria-selected="${state.tab===k}" data-k="${k}">${l}</button>`).join("");
  $(".search").hidden = !["nfl","cfb","cbb","nba","nhl"].includes(state.tab);
  $("#main").innerHTML = state.tab === "home" ? homePage() : state.tab === "record" ? recordPage() : state.tab === "how" ? howPage() : state.tab === "top25" ? top25Page() : board(state.tab);
}
$("#brand").addEventListener("click", e => { e.preventDefault(); state.tab = "home"; history.replaceState(null,"","#home"); render(); window.scrollTo({top:0}); });
$("#tabs").addEventListener("click", e => { const k = e.target.closest("button")?.dataset.k; if(!k) return; state.tab = k; history.replaceState(null,"","#"+k); render(); window.scrollTo({top:0}); });
$("#q").addEventListener("input", e => { state.q = e.target.value; render(); });
$("#main").addEventListener("click", e => {
  const c = e.target.closest("[data-show]"); if (c) { state.show = c.dataset.show; save(); render(); return; }
  const spk = e.target.closest("[data-sharepick]");
  if (spk) { const [sp, gid, mk] = spk.dataset.sharepick.split("|");
    const p = (DATA.picks || []).find(x => x.sport === sp && String(x.game_id) === gid && x.market === mk && x.play);
    if (!p) return;
    let g = ((DATA[sp] || {}).board || []).find(x => String(x.id) === gid);
    if (!g) { const m = sp === "nfl" ? String(gid).match(/_([A-Z]+)_([A-Z]+)$/) : null;
      const ab = n => String(n).split(" ")[0].slice(0, 4).toUpperCase();
      g = {id: gid, away: p.away, home: p.home, kickoff: p.kickoff, away_abbr: m ? m[1] : ab(p.away), home_abbr: m ? m[2] : ab(p.home)}; }
    sharePlay(g, sp, p); return; }
  const sh = e.target.closest("[data-share]");
  if (sh) { const g = (DATA[state.tab]?.board || []).find(x => String(x.id) === sh.dataset.share); if (g) sharePlay(g); return; }
  const fv = e.target.closest("[data-fav]");
  if (fv) { const g = (DATA[state.tab]?.board || []).find(x => String(x.id) === fv.dataset.fav);
    if (g) { const on = isFav(g); [g.home, g.away].forEach(t => on ? favs.delete(t) : favs.add(t)); saveFavs(); render(); } return; }
  const tk = e.target.closest("[data-track]"); if (tk) { state.track = tk.dataset.track; render(); return; }
  const rm = e.target.closest("[data-rm]"); if (rm) { const [s,m] = rm.dataset.rm.split(":"); state.rmkt[s] = m; render(); return; }
  const go = e.target.closest("[data-go]");
  if (go) { state.tab = go.dataset.go; state.show = "all"; history.replaceState(null,"","#"+state.tab); render(); window.scrollTo({top:0}); return; }
  const j = e.target.closest("[data-jump]");
  if (j && j.dataset.sport) { state.tab = j.dataset.sport; history.replaceState(null,"","#"+state.tab); }
  if (j) { const id = j.dataset.jump; state.show = "all"; state.q = ""; $("#q").value = ""; open.add(id); render();
    const el = document.getElementById("g-"+id); if (el) el.scrollIntoView({block:"center", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"}); return; }
  const l = e.target.closest("[data-toggle]");
  if (l) { const id = l.dataset.toggle; open.has(id) ? open.delete(id) : open.add(id); render(); const b = document.querySelector(`[data-toggle="${id}"]`); if (b) b.focus({preventScroll:true}); }
});
$("#main").addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches(".prow[data-jump], .pchip[data-jump]")) { e.preventDefault(); e.target.click(); }
});
setInterval(() => { document.querySelectorAll(".cd[data-ko]").forEach(el => { const t = countdown(el.dataset.ko); if (t) el.textContent = t; else render(); }); }, 30000);
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("/sw.js").catch(() => {});
$("#labtag").textContent = MODE === "lab" ? "Lab" : "";
$("#upd").textContent = "Model run " + new Date(DATA.updated).toLocaleString(undefined,{weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit",timeZoneName:"short"}) + ".";
render();
</script>
